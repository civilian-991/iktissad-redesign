name: Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Run every Monday at 08:00 UTC to catch newly-disclosed CVEs
    - cron: "0 8 * * 1"

jobs:
  audit:
    name: npm audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: iktissad-redesign

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: iktissad-redesign/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit (fail on high/critical)
        # --audit-level=high means the job fails only for high or critical severity.
        # Moderate/low are reported but don't break CI.
        run: npm audit --audit-level=high

      - name: Upload audit report
        if: always()
        run: npm audit --json > npm-audit-report.json || true

      - name: Store audit report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: iktissad-redesign/npm-audit-report.json
          retention-days: 30

  license-check:
    name: License compatibility
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: iktissad-redesign

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: iktissad-redesign/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check for disallowed licenses
        run: |
          npx license-checker --production \
            --excludeLicenses "MIT,ISC,BSD-2-Clause,BSD-3-Clause,Apache-2.0,CC0-1.0,CC-BY-3.0,CC-BY-4.0,0BSD,Python-2.0,Unlicense,BlueOak-1.0.0" \
            --failOn "GPL-2.0,GPL-3.0,LGPL-2.0,LGPL-2.1,LGPL-3.0,AGPL-3.0" \
            || echo "::warning::Some packages have non-standard licenses — review required"
