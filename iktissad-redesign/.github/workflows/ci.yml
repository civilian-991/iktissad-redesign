name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: iktissad-redesign/package-lock.json
      - run: npm ci
        working-directory: iktissad-redesign
      - run: npm run lint
        working-directory: iktissad-redesign

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: iktissad-redesign/package-lock.json
      - run: npm ci
        working-directory: iktissad-redesign
      - run: npm run type-check
        working-directory: iktissad-redesign

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, type-check]
    env:
      # Sentry source map upload requires auth token in CI
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
      # Stub env vars so the build doesn't fail on missing runtime config
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: iktissad-redesign/package-lock.json
      - run: npm ci
        working-directory: iktissad-redesign
      - run: npm run build
        working-directory: iktissad-redesign
