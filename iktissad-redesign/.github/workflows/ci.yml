name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: iktissad-redesign/package-lock.json
      - run: npm ci
        working-directory: iktissad-redesign
      # Lint budget (May 2026 baseline): 326 warnings remaining after the
      # post-launch lint cleanup pass. Breakdown:
      #   239 @typescript-eslint/no-explicit-any  — postgrest-js v2.95.3 type-inference workaround (see CLAUDE.md)
      #    68 @next/next/no-img-element           — admin previews + email-renderer <img> usage (not user-facing perf)
      #    16 react-hooks/set-state-in-effect     — React Compiler advisories on client-only mount patterns
      #     2 react-hooks/preserve-manual-memoization, 1 react-hooks/incompatible-library — compiler advisories
      # New warnings must be fixed before merge or the budget bumped intentionally.
      - run: npm run lint -- --max-warnings 326
        working-directory: iktissad-redesign

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: iktissad-redesign/package-lock.json
      - run: npm ci
        working-directory: iktissad-redesign
      - run: npm run type-check
        working-directory: iktissad-redesign

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [lint, type-check]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: iktissad-redesign/package-lock.json
      - run: npm ci
        working-directory: iktissad-redesign
      - run: npm test
        working-directory: iktissad-redesign

  audit:
    name: Audit (prod deps)
    runs-on: ubuntu-latest
    # Non-blocking: high/critical advisories surface in CI but don't fail the
    # pipeline. Promote to required if/when the dep tree is fully patched.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: iktissad-redesign/package-lock.json
      - run: npm ci
        working-directory: iktissad-redesign
      - run: npm run audit-prod
        working-directory: iktissad-redesign

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, type-check, test]
    env:
      # Sentry source map upload requires auth token in CI
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
      # Stub env vars so the build doesn't fail on missing runtime config
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: iktissad-redesign/package-lock.json
      - run: npm ci
        working-directory: iktissad-redesign
      - run: npm run build
        working-directory: iktissad-redesign
